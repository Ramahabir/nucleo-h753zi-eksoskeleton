[platformio]
src_dir = Core/Src
include_dir = Core/Inc

[env:nucleo_h753zi]
platform = ststm32
board = nucleo_h753zi
framework = stm32cube

; Use custom stm32g0xx_hal_conf.h generated by STM32CubeMX
board_build.stm32cube.custom_config_header = yes

; Upload & Debug settings (uses on-board ST-LINK)
upload_protocol = stlink
debug_tool = stlink

; Serial monitor configuration for USART2 Virtual COM port
monitor_speed = 115200